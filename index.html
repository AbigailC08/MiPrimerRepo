<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<title>PrestaLab — Prototipo funcional</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --navy:#0B1B33; --blue:#2E6FDB; --blue-dark:#1E4FA8; --ice:#EAF1FD; --white:#FFFFFF;
  --slate:#5A6B85; --green:#2E9E5B; --amber:#D6941F; --red:#D6483F; --border:#E1E6EE; --bg:#F5F7FA;
  --font: 'Inter', -apple-system, 'Segoe UI', Arial, sans-serif;
}
* { box-sizing:border-box; }
html,body { margin:0; padding:0; font-family:var(--font); background:var(--bg); color:var(--navy);
  padding-top: env(safe-area-inset-top,0px); padding-bottom: env(safe-area-inset-bottom,0px); }
button { font-family:var(--font); cursor:pointer; }
input, select { font-family:var(--font); }
#app { min-height:100vh; }

/* ---- Login ---- */
.login-wrap { min-height:100vh; display:flex; align-items:center; justify-content:center; background:var(--navy); }
.login-card { background:var(--white); border-radius:18px; padding:44px 40px; width:380px; max-width:90vw; box-shadow:0 30px 70px rgba(0,0,0,0.35); text-align:center; }
.login-card img { width:56px; height:56px; margin-bottom:10px; }
.login-card h1 { font-size:22px; margin:6px 0 2px 0; }
.login-card p { color:var(--slate); font-size:13px; margin:0 0 22px 0; }
.field { text-align:left; margin-bottom:14px; }
.field label { display:block; font-size:12.5px; font-weight:700; color:var(--slate); margin-bottom:5px; }
.field input, .field select { width:100%; padding:11px 13px; border-radius:9px; border:1.5px solid var(--border); background:#F7F9FC; font-size:14px; }
.btn-primary { width:100%; background:var(--blue); color:#fff; border:none; padding:13px; border-radius:9px; font-weight:700; font-size:14.5px; margin-top:6px; }
.btn-primary:hover { background:var(--blue-dark); }
.hint { font-size:12px; color:var(--slate); margin-top:14px; }

/* ---- App shell ---- */
.shell { display:flex; min-height:100vh; }
.sidebar { width:230px; background:var(--navy); color:#fff; flex-shrink:0; padding:24px 0; position:sticky; top:0; height:100vh; }
.sidebar .brand { display:flex; align-items:center; gap:10px; padding:0 20px 20px 20px; border-bottom:1px solid rgba(255,255,255,0.1); margin-bottom:14px; }
.sidebar .brand img { width:34px; height:34px; border-radius:8px; }
.sidebar .brand b { font-size:16px; }
.sidebar .brand span { display:block; font-size:9.5px; color:#9FB3D6; letter-spacing:0.5px; }
.navitem { display:block; width:100%; text-align:left; background:none; border:none; color:#B9C6DE; padding:12px 20px; font-size:14px; font-weight:600; }
.navitem.active { background:var(--blue); color:#fff; }
.navitem:hover:not(.active) { background:rgba(255,255,255,0.06); color:#fff; }
.main { flex:1; min-width:0; }
.topbar { background:#fff; border-bottom:1px solid var(--border); padding:22px 32px; display:flex; align-items:center; justify-content:space-between; }
.topbar h2 { margin:0; font-size:22px; }
.content { padding:24px 32px; }
.toolbar { display:flex; gap:14px; margin-bottom:18px; flex-wrap:wrap; align-items:center; justify-content:space-between; }
.search-box { position:relative; flex:1; min-width:220px; max-width:420px; }
.search-box input { width:100%; padding:11px 14px 11px 34px; border-radius:9px; border:1.5px solid var(--border); font-size:13.5px; background:#fff; }
.search-box::before { content:"🔍"; position:absolute; left:12px; top:50%; transform:translateY(-50%); font-size:13px; opacity:0.5; }
.btn { background:var(--blue); color:#fff; border:none; padding:11px 18px; border-radius:9px; font-weight:700; font-size:13.5px; white-space:nowrap; }
.btn:hover { background:var(--blue-dark); }
.btn.secondary { background:#fff; color:var(--navy); border:1.5px solid var(--border); }
.btn.small { padding:6px 12px; font-size:12.5px; border-radius:7px; }
.filters { display:flex; gap:10px; }
.filters select { padding:9px 12px; border-radius:9px; border:1.5px solid var(--border); background:#fff; font-size:13px; }

table { width:100%; border-collapse:collapse; background:#fff; border-radius:12px; overflow:hidden; border:1px solid var(--border); }
th { text-align:left; font-size:11.5px; letter-spacing:0.4px; color:var(--slate); text-transform:uppercase; background:#F7F9FC; padding:13px 16px; font-weight:800; }
td { padding:14px 16px; font-size:13.5px; border-top:1px solid var(--border); color:var(--navy); }
tr:nth-child(even) td { background:#FBFCFE; }
.pill { display:inline-block; padding:4px 12px; border-radius:20px; font-size:11.5px; font-weight:800; }
.pill.disponible, .pill.activo, .pill.corriente { background:#DCF3E4; color:var(--green); }
.pill.prestado { background:var(--ice); color:var(--blue); }
.pill.mantenimiento, .pill.pendiente { background:#FCEFD8; color:var(--amber); }
.pill.finalizado { background:#EEF0F4; color:var(--slate); }
.pill.vencido { background:#FBE1DF; color:var(--red); }
.pill.basico { background:#EEF0F4; color:var(--slate); }
.pill.media { background:var(--ice); color:var(--blue); }
.pill.alta { background:#F1E9FB; color:#7A3FC4; }
.link-btn { background:none; border:none; color:var(--blue); font-weight:700; font-size:12.5px; padding:0; margin-right:10px; }
.link-btn.danger { color:var(--red); }

.cards-summary { display:flex; gap:16px; margin-bottom:20px; flex-wrap:wrap; }
.summary-card { background:#fff; border:1px solid var(--border); border-radius:12px; padding:16px 20px; min-width:160px; }
.summary-card .lbl { font-size:12px; color:var(--slate); font-weight:600; margin-bottom:4px; }
.summary-card .val { font-size:24px; font-weight:800; }

.equip-grid { display:grid; grid-template-columns: repeat(auto-fill, minmax(230px,1fr)); gap:16px; }
.equip-card { background:#fff; border:1px solid var(--border); border-radius:14px; padding:16px; }
.equip-card .thumb { background:var(--ice); border-radius:10px; height:70px; display:flex; align-items:center; justify-content:center; font-size:26px; margin-bottom:12px; }
.equip-card h4 { margin:0 0 8px 0; font-size:14.5px; }
.equip-card .row { display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.equip-card .rate { font-size:12px; font-weight:700; color:var(--navy); }

/* Modal */
.overlay { position:fixed; inset:0; background:rgba(11,27,51,0.55); display:flex; align-items:center; justify-content:center; z-index:200; padding:20px; }
.modal { background:#fff; border-radius:16px; padding:28px 30px; width:420px; max-width:100%; max-height:88vh; overflow-y:auto; }
.modal h3 { margin:0 0 18px 0; font-size:18px; }
.modal .actions { display:flex; gap:10px; margin-top:18px; }
.modal .actions .btn, .modal .actions .btn.secondary { flex:1; text-align:center; }
.empty { text-align:center; padding:50px 20px; color:var(--slate); font-size:14px; }
</style>
</head>

    { id: 1, cliente: "Juan Pérez", equipoId: 2, inicio: "2026-09-01", fin: "2026-09-15", estadoContrato: "Activo", pagado: false },
    { id: 2, cliente: "María López", equipoId: 5, inicio: "2026-09-05", fin: "2026-09-20", estadoContrato: "Activo", pagado: true },
    { id: 3, cliente: "Carlos Ruiz", equipoId: 1, inicio: "2026-08-20", fin: "2026-08-30", estadoContrato: "Finalizado", pagado: false },
  ],
  searchInv: "", searchCli: "", searchPag: "",
  filterCategoria: "Todas", filterEstado: "Todos",
  modal: null, // 'agregarEquipo' | 'nuevoContrato' | 'editarEquipo'
  editEquipoId: null,
};

function fmtDate(iso) {
  const [y,m,d] = iso.split("-");
  return d + "/" + m + "/" + y;
}
function diffDays(a,b) {
  return Math.round((new Date(b) - new Date(a)) / 86400000);
}
function findEquipo(id) { return state.equipos.find(e => e.id === id); }
function slug(s) { return s.toLowerCase().replace(/[áéíóú]/g, c => ({á:'a',é:'e',í:'i',ó:'o',ú:'u'}[c])); }

function computePagos() {
  const hoy = new Date();
  return state.contratos.map(c => {
    const eq = findEquipo(c.equipoId);
    const tarifa = eq ? TARIFAS[eq.categoria] : 0;
    const dias = diffDays(c.inicio, c.fin);
    if (c.pagado) {
      return { ...c, equipoNombre: eq ? eq.nombre : "—", tarifa, dias, monto: 0, estadoPago: "Al corriente", fechaLimite: null };
    }
    const vencido = hoy > new Date(c.fin);
    return { ...c, equipoNombre: eq ? eq.nombre : "—", tarifa, dias, monto: dias * tarifa, estadoPago: vencido ? "Vencido" : "Pendiente", fechaLimite: c.fin };
  });
}

function render() {
  const app = document.getElementById("app");
  if (!state.loggedIn) { app.innerHTML = renderLogin(); attachLoginEvents(); return; }
  app.innerHTML = renderShell();
  attachShellEvents();
}

// ---------------- LOGIN ----------------
function renderLogin() {
  return `
  <div class="login-wrap">
    <div class="login-card">
      <img src="${LOGO}">
      <h1>PrestaLab</h1>
      <p>Renta de equipo de cómputo</p>
      <div class="field"><label>Usuario</label><input id="loginUser" type="text" placeholder="usuario@prestalab.com"></div>
      <div class="field"><label>Contraseña</label><input id="loginPass" type="password" placeholder="••••••••"></div>
      <button class="btn-primary" id="loginBtn">Iniciar sesión</button>
      <div class="hint">Prototipo de demostración — cualquier dato entra.</div>
    </div>
  </div>`;
}
function attachLoginEvents() {
  document.getElementById("loginBtn").addEventListener("click", () => {
    state.loggedIn = true;
    state.view = "inventario";
    render();
  });
}

// ---------------- SHELL ----------------
function renderShell() {
  const items = [
    ["inventario", "Inventario"],
    ["clientes", "Clientes y contratos"],
    ["disponibilidad", "Disponibilidad"],
    ["pagos", "Pagos y adeudos"],
  ];
  const titles = { inventario: "Inventario de equipos", clientes: "Clientes y contratos", disponibilidad: "Disponibilidad de equipos", pagos: "Pagos y adeudos" };
  return `
  <div class="shell">
    <div class="sidebar">
      <div class="brand"><img src="${LOGO}"><div><b>PrestaLab</b><span>RENTA DE EQUIPO</span></div></div>
      ${items.map(([k,label]) => `<button class="navitem ${state.view===k?'active':''}" data-view="${k}">${label}</button>`).join("")}
    </div>
    <div class="main">
      <div class="topbar"><h2>${titles[state.view]}</h2></div>
      <div class="content">${renderView()}</div>
    </div>
  </div>
  ${state.modal ? renderModal() : ""}
  `;
}

function renderView() {
  if (state.view === "inventario") return renderInventario();
  if (state.view === "clientes") return renderClientes();
  if (state.view === "disponibilidad") return renderDisponibilidad();
  if (state.view === "pagos") return renderPagos();
  return "";
}

// ---------------- INVENTARIO ----------------
function renderInventario() {
  const q = state.searchInv.trim().toLowerCase();
  const rows = state.equipos.filter(e => e.nombre.toLowerCase().includes(q));
  return `
  <div class="toolbar">
    <div class="search-box"><input id="searchInv" placeholder="Buscar equipo..." value="${state.searchInv}"></div>
    <button class="btn" id="btnAgregarEquipo">+ Agregar equipo</button>
  </div>
  <table>
    <thead><tr><th>Equipo</th><th>Categoría</th><th>Estado</th><th>Cliente</th><th>Acciones</th></tr></thead>
    <tbody>
      ${rows.length ? rows.map(e => `
        <tr>
          <td><b>${e.nombre}</b></td>
          <td><span class="pill ${slug(e.categoria)}">${e.categoria}</span></td>
          <td><span class="pill ${slug(e.estado)}">${e.estado}</span></td>
          <td>${e.cliente || "—"}</td>
          <td><button class="link-btn" data-edit-equipo="${e.id}">Editar</button></td>
        </tr>`).join("") : `<tr><td colspan="5" class="empty">Sin resultados para "${state.searchInv}"</td></tr>`}
    </tbody>
  </table>`;
}

// ---------------- CLIENTES ----------------
function renderClientes() {
  const q = state.searchCli.trim().toLowerCase();
  const rows = state.contratos.filter(c => c.cliente.toLowerCase().includes(q));
  return `
  <div class="toolbar">
    <div class="search-box"><input id="searchCli" placeholder="Buscar cliente..." value="${state.searchCli}"></div>
    <button class="btn" id="btnNuevoContrato">+ Nuevo contrato</button>
  </div>
  <table>
    <thead><tr><th>Cliente</th><th>Equipo prestado</th><th>Fecha inicio</th><th>Fecha fin</th><th>Estado</th></tr></thead>
    <tbody>
      ${rows.length ? rows.map(c => {
        const eq = findEquipo(c.equipoId);
        return `<tr>
          <td><b>${c.cliente}</b></td>
          <td>${eq ? eq.nombre : "—"}</td>
          <td>${fmtDate(c.inicio)}</td>
          <td>${fmtDate(c.fin)}</td>
          <td><span class="pill ${slug(c.estadoContrato)}">${c.estadoContrato}</span></td>
        </tr>`;
      }).join("") : `<tr><td colspan="5" class="empty">Sin resultados para "${state.searchCli}"</td></tr>`}
    </tbody>
  </table>`;
}

// ---------------- DISPONIBILIDAD ----------------
function renderDisponibilidad() {
  let list = state.equipos;
  if (state.filterCategoria !== "Todas") list = list.filter(e => e.categoria === state.filterCategoria);
  if (state.filterEstado !== "Todos") list = list.filter(e => e.estado === state.filterEstado);
  return `
  <div class="toolbar">
    <div class="filters">
      <select id="filterCategoria">
        ${["Todas","Básico","Media","Alta"].map(o => `<option ${state.filterCategoria===o?"selected":""}>${o}</option>`).join("")}
      </select>
      <select id="filterEstado">
        ${["Todos","Disponible","Prestado","Mantenimiento"].map(o => `<option ${state.filterEstado===o?"selected":""}>${o}</option>`).join("")}
      </select>
    </div>
  </div>
  <div class="equip-grid">
    ${list.length ? list.map(e => `
      <div class="equip-card">
        <div class="thumb">💻</div>
        <h4>${e.nombre}</h4>
        <div class="row"><span class="pill ${slug(e.categoria)}">${e.categoria}</span><span class="rate">$${TARIFAS[e.categoria]} MXN/día</span></div>
        <span class="pill ${slug(e.estado)}">${e.estado}</span>
      </div>`).join("") : `<div class="empty">No hay equipos con esos filtros</div>`}
  </div>`;
}

// ---------------- PAGOS ----------------
function renderPagos() {
  const pagos = computePagos();
  const q = state.searchPag.trim().toLowerCase();
  const rows = pagos.filter(p => p.cliente.toLowerCase().includes(q));
  const total = pagos.filter(p => !p.pagado).reduce((s,p) => s + p.monto, 0);
  const alCorriente = pagos.filter(p => p.estadoPago === "Al corriente").length;
  const vencidos = pagos.filter(p => p.estadoPago === "Vencido").length;
  return `
  <div class="toolbar">
    <div class="search-box"><input id="searchPag" placeholder="Buscar cliente..." value="${state.searchPag}"></div>
  </div>
  <div class="cards-summary">
    <div class="summary-card"><div class="lbl">Total adeudado</div><div class="val" style="color:var(--red)">$${total.toLocaleString("es-MX")} MXN</div></div>
    <div class="summary-card"><div class="lbl">Clientes al corriente</div><div class="val" style="color:var(--green)">${alCorriente}</div></div>
    <div class="summary-card"><div class="lbl">Pagos vencidos</div><div class="val" style="color:var(--amber)">${vencidos}</div></div>
  </div>
  <table>
    <thead><tr><th>Cliente</th><th>Equipo</th><th>Días</th><th>Tarifa/día</th><th>Monto</th><th>Fecha límite</th><th>Estado</th><th></th></tr></thead>
    <tbody>
      ${rows.length ? rows.map(p => `
        <tr>
          <td><b>${p.cliente}</b></td>
          <td>${p.equipoNombre}</td>
          <td>${p.dias}</td>
          <td>$${p.tarifa}</td>
          <td>$${p.monto.toLocaleString("es-MX")} MXN</td>
          <td>${p.fechaLimite ? fmtDate(p.fechaLimite) : "—"}</td>
          <td><span class="pill ${slug(p.estadoPago)}">${p.estadoPago}</span></td>
          <td>${p.pagado ? "" : `<button class="link-btn" data-pagar="${p.id}">Registrar pago</button>`}</td>
        </tr>`).join("") : `<tr><td colspan="8" class="empty">Sin resultados para "${state.searchPag}"</td></tr>`}
    </tbody>
  </table>`;
}

// ---------------- MODALS ----------------
function renderModal() {
  if (state.modal === "agregarEquipo") {
    return `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h3>Agregar equipo</h3>
        <div class="field"><label>Nombre del equipo</label><input id="mNombre" placeholder="Ej. Laptop Dell Latitude"></div>
        <div class="field"><label>Categoría</label>
          <select id="mCategoria">
            <option>Básico</option><option>Media</option><option>Alta</option>
          </select>
        </div>
        <div class="field"><label>Estado inicial</label>
          <select id="mEstado"><option>Disponible</option><option>Mantenimiento</option></select>
        </div>
        <div class="actions">
          <button class="btn secondary" id="mCancel">Cancelar</button>
          <button class="btn" id="mSave">Guardar equipo</button>
        </div>
      </div>
    </div>`;
  }
  if (state.modal === "editarEquipo") {
    const eq = findEquipo(state.editEquipoId);
    return `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h3>Editar equipo</h3>
        <div class="field"><label>Nombre</label><input id="mNombre" value="${eq.nombre}"></div>
        <div class="field"><label>Categoría</label>
          <select id="mCategoria">
            ${["Básico","Media","Alta"].map(o => `<option ${eq.categoria===o?"selected":""}>${o}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Estado</label>
          <select id="mEstado">
            ${["Disponible","Prestado","Mantenimiento"].map(o => `<option ${eq.estado===o?"selected":""}>${o}</option>`).join("")}
          </select>
        </div>
        <div class="field"><label>Cliente (si está prestado)</label><input id="mCliente" value="${eq.cliente||''}" placeholder="Nombre del cliente"></div>
        <div class="actions">
          <button class="btn secondary" id="mCancel">Cancelar</button>
          <button class="btn" id="mSave">Guardar cambios</button>
        </div>
      </div>
    </div>`;
  }
  if (state.modal === "nuevoContrato") {
    const disponibles = state.equipos.filter(e => e.estado === "Disponible");
    return `
    <div class="overlay" id="overlay">
      <div class="modal">
        <h3>Nuevo contrato</h3>
        <div class="field"><label>Cliente</label><input id="mCliente" placeholder="Nombre del cliente"></div>
        <div class="field"><label>Equipo</label>
          <select id="mEquipo">
            ${disponibles.length ? disponibles.map(e => `<option value="${e.id}">${e.nombre} — $${TARIFAS[e.categoria]}/día</option>`).join("") : `<option value="">No hay equipos disponibles</option>`}
          </select>
        </div>
        <div class="field"><label>Fecha inicio</label><input id="mInicio" type="date" value="2026-09-19"></div>
        <div class="field"><label>Fecha fin</label><input id="mFin" type="date" value="2026-09-26"></div>
        <div class="actions">
          <button class="btn secondary" id="mCancel">Cancelar</button>
          <button class="btn" id="mSave" ${disponibles.length?"":"disabled"}>Crear contrato</button>
        </div>
      </div>
    </div>`;
  }
  return "";
}

// ---------------- EVENTS ----------------
function attachShellEvents() {
  document.querySelectorAll(".navitem").forEach(btn => {
    btn.addEventListener("click", () => { state.view = btn.dataset.view; state.modal = null; render(); });
  });

  // Inventario
  const searchInv = document.getElementById("searchInv");
  if (searchInv) searchInv.addEventListener("input", (e) => { state.searchInv = e.target.value; render(); document.getElementById("searchInv").focus(); document.getElementById("searchInv").selectionStart = document.getElementById("searchInv").value.length; });
  const btnAgregarEquipo = document.getElementById("btnAgregarEquipo");
  if (btnAgregarEquipo) btnAgregarEquipo.addEventListener("click", () => { state.modal = "agregarEquipo"; render(); });
  document.querySelectorAll("[data-edit-equipo]").forEach(btn => {
    btn.addEventListener("click", () => { state.editEquipoId = parseInt(btn.dataset.editEquipo); state.modal = "editarEquipo"; render(); });
  });

  // Clientes
  const searchCli = document.getElementById("searchCli");
  if (searchCli) searchCli.addEventListener("input", (e) => { state.searchCli = e.target.value; render(); document.getElementById("searchCli").focus(); document.getElementById("searchCli").selectionStart = document.getElementById("searchCli").value.length; });
  const btnNuevoContrato = document.getElementById("btnNuevoContrato");
  if (btnNuevoContrato) btnNuevoContrato.addEventListener("click", () => { state.modal = "nuevoContrato"; render(); });

  // Disponibilidad
  const fc = document.getElementById("filterCategoria");
  if (fc) fc.addEventListener("change", (e) => { state.filterCategoria = e.target.value; render(); });
  const fe = document.getElementById("filterEstado");
  if (fe) fe.addEventListener("change", (e) => { state.filterEstado = e.target.value; render(); });

  // Pagos
  const searchPag = document.getElementById("searchPag");
  if (searchPag) searchPag.addEventListener("input", (e) => { state.searchPag = e.target.value; render(); document.getElementById("searchPag").focus(); document.getElementById("searchPag").selectionStart = document.getElementById("searchPag").value.length; });
  document.querySelectorAll("[data-pagar]").forEach(btn => {
    btn.addEventListener("click", () => {
      const id = parseInt(btn.dataset.pagar);
      const c = state.contratos.find(x => x.id === id);
      if (c) c.pagado = true;
      render();
    });
  });

  // Modal events
  const overlay = document.getElementById("overlay");
  if (overlay) {
    overlay.addEventListener("click", (e) => { if (e.target.id === "overlay") { state.modal = null; render(); } });
    const cancel = document.getElementById("mCancel");
    if (cancel) cancel.addEventListener("click", () => { state.modal = null; render(); });

    const save = document.getElementById("mSave");
    if (save) save.addEventListener("click", () => {
      if (state.modal === "agregarEquipo") {
        const nombre = document.getElementById("mNombre").value.trim();
        if (!nombre) { alert("Ponle un nombre al equipo."); return; }
        uid++;
        state.equipos.push({ id: uid, nombre, categoria: document.getElementById("mCategoria").value, estado: document.getElementById("mEstado").value, cliente: null });
        state.modal = null; render();
      }
      if (state.modal === "editarEquipo") {
        const eq = findEquipo(state.editEquipoId);
        eq.nombre = document.getElementById("mNombre").value.trim() || eq.nombre;
        eq.categoria = document.getElementById("mCategoria").value;
        eq.estado = document.getElementById("mEstado").value;
        eq.cliente = eq.estado === "Prestado" ? (document.getElementById("mCliente").value.trim() || eq.cliente) : null;
        state.modal = null; render();
      }
      if (state.modal === "nuevoContrato") {
        const cliente = document.getElementById("mCliente").value.trim();
        const equipoSel = document.getElementById("mEquipo");
        const equipoId = parseInt(equipoSel.value);
        const inicio = document.getElementById("mInicio").value;
        const fin = document.getElementById("mFin").value;
        if (!cliente || !equipoId || !inicio || !fin) { alert("Completa todos los campos."); return; }
        if (new Date(fin) <= new Date(inicio)) { alert("La fecha fin debe ser posterior a la fecha inicio."); return; }
        uid++;
        state.contratos.push({ id: uid, cliente, equipoId, inicio, fin, estadoContrato: "Activo", pagado: false });
        const eq = findEquipo(equipoId);
        eq.estado = "Prestado"; eq.cliente = cliente;
        state.modal = null; render();
      }
    });
  }
}

render();
</script>
</body>
</html>
